# /etc/nginx/sites-available/fringe
#
# Julia & Jason's Fringe 2026 Shortlist — a single static page regenerated
# from shows.json and rsynced here by `make sync`.
#
# Port 80 only; certbot rewrites this to add the 443 server block and the
# http -> https redirect once fringe.jmckalex.org resolves to this droplet.

server {

    server_name fringe.jmckalex.org;

    root /var/www/fringe;
    index index.html;

    access_log /var/log/nginx/fringe.access.log;
    error_log  /var/log/nginx/fringe.error.log;

    # Per-show booked/seen marks. Reads are public; writes need the key the
    # service itself checks. Loopback only — never exposed directly.
    # The live-update stream is long-lived, so it needs buffering off and a
    # timeout far beyond the 30s that suits ordinary API calls. Exact-match
    # location, so it wins over the /api/ prefix below.
    location = /api/events {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The page is rebuilt as often as hourly during the Fringe, and it carries
    # a "Last updated" stamp — so never let a browser serve a stale copy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fringe.jmckalex.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fringe.jmckalex.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = fringe.jmckalex.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name fringe.jmckalex.org;
    return 404; # managed by Certbot


}